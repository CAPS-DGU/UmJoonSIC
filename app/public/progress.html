<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- A static local page: nothing is loaded from elsewhere. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'"
    />
    <style>
      /* The window is the card: no frame around it. Light or dark, as the app (?theme=). */
      :root {
        --bg: #ffffff;
        --text: #111827;
        --muted: #4b5563;
        --track: #e5e7eb;
        --bar: #2563eb;
        --fail: #dc2626;
      }
      :root.dark {
        color-scheme: dark; /* scroll bars and form controls follow */
        --bg: #1f2937;
        --text: #f9fafb;
        --muted: #d1d5db;
        --track: #374151;
        --bar: #60a5fa;
        --fail: #f87171;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        font-family:
          'Pretendard Variable',
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          'Malgun Gothic',
          sans-serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 12px;
        padding: 0 24px;
        box-sizing: border-box;
        -webkit-app-region: drag;
        user-select: none;
      }
      #heading {
        font-size: 15px;
        font-weight: 600;
      }
      .track {
        height: 8px;
        background: var(--track);
        border-radius: 4px;
        overflow: hidden;
      }
      #bar {
        height: 100%;
        width: 0%;
        background: var(--bar);
        transition: width 0.2s ease;
      }
      #status {
        font-size: 13px;
        color: var(--muted);
        overflow-wrap: anywhere;
      }
      body.failed #heading,
      body.failed #status {
        color: var(--fail);
      }
      body.failed #bar {
        width: 100% !important;
        background: var(--fail);
      }
    </style>
  </head>
  <body>
    <div id="heading"></div>
    <div class="track"><div id="bar"></div></div>
    <div id="status"></div>
    <script>
      if (new URLSearchParams(location.search).get('theme') === 'dark') {
        document.documentElement.classList.add('dark');
      }
      /** Called by the main process: { heading, percent, status, failed }. */
      window.setProgress = function (state) {
        if (state.heading !== undefined)
          document.getElementById('heading').textContent = state.heading;
        if (state.percent !== undefined)
          document.getElementById('bar').style.width = state.percent + '%';
        if (state.status !== undefined)
          document.getElementById('status').textContent = state.status;
        document.body.classList.toggle('failed', !!state.failed);
      };
    </script>
  </body>
</html>
